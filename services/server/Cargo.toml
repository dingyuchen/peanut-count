[package]
name = "peanut-count"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "A SQLite-backed double-entry ledger with Beancount export"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libsql = { version = "0.10", default-features = false, features = ["remote", "tls"] }
rmcp = { version = "3.11", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
