name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build release binary
        run: cargo +1.98.0 build --locked --release

      - name: Run tests
        run: cargo +1.98.0 test --locked
